# GolangCI-Lint configuration for clade
# Compatible with both v1 and v2

linters:
  enable:
    - unused        # Dead code
    - misspell      # Typos in comments
  disable:
    - errcheck      # Too many false positives
    - govet         # Shadow warnings too noisy for this codebase
    - ineffassign   # False positives on multi-return patterns
    - staticcheck   # Deprecated API warnings for compatibility

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

run:
  timeout: 5m
  tests: true
